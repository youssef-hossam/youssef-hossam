<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Youssef Hadwa — Flutter Developer">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace; }
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes floaty2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
    @keyframes blink { 0%,44%,52%,100% { transform: scaleY(1); } 48% { transform: scaleY(0.1); } }
    @keyframes caret { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse { 0%,100% { opacity: .9; } 50% { opacity: .55; } }
    .f1 { animation: floaty 5s ease-in-out infinite; }
    .f2 { animation: floaty2 6s ease-in-out infinite; }
    .f3 { animation: floaty 7s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    .caret { animation: caret 1s steps(1) infinite; }
    .dot { animation: pulse 3s ease-in-out infinite; }
  </style>

  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#2A2350"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#15102B"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- shapes -->
    <circle cx="40" cy="-10" r="125" fill="#21B18F"/>
    <circle class="dot" cx="210" cy="75" r="22" fill="#FFD166"/>
    <circle cx="290" cy="320" r="70" fill="#9378DF"/>

    <!-- chips -->
    <g class="f1">
      <rect x="290" y="34" width="92" height="28" rx="14" fill="#2A2350" transform="rotate(-6 336 48)"/>
      <text x="336" y="53" text-anchor="middle" class="mono" font-size="13" fill="#B9A6F5" transform="rotate(-6 336 48)">&lt;Widget/&gt;</text>
    </g>
    <g class="f2">
      <rect x="265" y="172" width="64" height="28" rx="14" fill="#2E2433"/>
      <text x="297" y="191" text-anchor="middle" class="mono" font-size="13" fill="#FFD166">async</text>
    </g>
    <g class="f3">
      <rect x="452" y="250" width="54" height="26" rx="13" fill="#2A2350"/>
      <text x="479" y="268" text-anchor="middle" class="mono" font-size="13" fill="#FF8A55">Bloc</text>
    </g>
    <g class="f2">
      <rect x="600" y="52" width="68" height="26" rx="13" fill="#123A36" transform="rotate(4 634 65)"/>
      <text x="634" y="70" text-anchor="middle" class="mono" font-size="13" fill="#21B18F" transform="rotate(4 634 65)">200 OK</text>
    </g>

    <!-- braces mascot -->
    <g transform="translate(372 58)">
      <text x="0" y="148" class="sans" font-size="190" font-weight="800" fill="#FF6B2C">{</text>
      <text x="118" y="148" class="sans" font-size="190" font-weight="800" fill="#FF6B2C">}</text>
      <ellipse class="eye" cx="88" cy="74" rx="8" ry="11" fill="#F3F0FF"/>
      <rect x="110" y="70" width="22" height="7" rx="3.5" fill="#F3F0FF" transform="rotate(-6 121 73)"/>
      <path d="M72 102 A 36 36 0 0 0 140 102" fill="none" stroke="#F3F0FF" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- name + role -->
    <text x="1150" y="112" text-anchor="end" class="sans" font-size="54" font-weight="800" fill="#F3F0FF">Youssef Hadwa</text>
    <circle cx="1155" cy="62" r="0" fill="#FF6B2C"/>
    <text x="1150" y="152" text-anchor="end" class="sans" font-size="22" font-weight="700">
      <tspan fill="#FF6B2C">Flutter Developer</tspan><tspan fill="#F3F0FF"> • I build apps people enjoy using</tspan>
    </text>

    <!-- code line -->
    <rect x="598" y="182" width="554" height="44" rx="10" fill="#201941" stroke="#3A3170"/>
    <text x="612" y="210" class="mono" font-size="15.5">
      <tspan fill="#FFD166">final</tspan><tspan fill="#C9C2E8"> me = </tspan><tspan fill="#FFD166">Developer</tspan><tspan fill="#C9C2E8">(name: </tspan><tspan fill="#21B18F">'Youssef'</tspan><tspan fill="#C9C2E8">, stack: </tspan><tspan fill="#21B18F">'Flutter'</tspan><tspan fill="#C9C2E8">);</tspan>
    </text>
    <rect class="caret" x="1138" y="194" width="2.5" height="20" fill="#FF6B2C"/>

    <text x="1150" y="262" text-anchor="end" class="mono" font-size="13" fill="#7E76A8">Clean Architecture · BLoC/Cubit · Firebase · REST APIs</text>
  </g>
</svg>
